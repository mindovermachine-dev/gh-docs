# .insitu.yml – insitu self-hosting configuration
# Run 'insitu plan' to preview  |  'insitu run' to execute
# cspell:ignore markdownlint

defaults:
  die-on-error: true
  timeout: 5m
  verbose: false

inventory:
  - id: "gh-auth"
    name: "GitHub Authentication"
    command: "gh auth status"

  - id: "install-takt"
    name: "Install Takt"
    command: "gh extension install devx-cafe/gh-tt"

  - id: "cspell"
    name: "Run cspell"
    command: "npx --no-install cspell"

  - id: "markdownlint"
    name: "Run markdownlint"
    command: "npx --no-install markdownlint-cli2"

  - id: "prettier"
    name: "Run Prettier"
    command: "npx --no-install prettier --check ."

  - id: "install-takt-shortcuts"
    name: "Install Takt Shortcuts"
    command: |
      gh alias set workon '!gh tt workon "$@"' --clobber 
      gh alias set wrapup '!gh tt wrapup "$@"' --clobber
      gh alias set deliver '!gh tt deliver "$@"' --clobber
      gh alias set semver '!gh tt semver "$@"' --clobber

  - id: "safe-repo"
    name: "Mark repository as safe for git operations"
    command: "git config --global --add safe.directory $(pwd)"

  - id: repo-gitconfig
    name: "Use repo-root .gitconfig for consistent git settings"
    command: |
      git config --local --get include.path | grep -e ../.gitconfig >/dev/null 2>&1 || \
      git config --local --add include.path ../.gitconfig

  - id: repo-npm
    name: "Install repo dependencies"
    command: |
      if [ -f package.json ]; then
        npm install
      fi

  - id: "fix-markdown"
    name: "Fix all fixable markdown issues"
    command: |
      npx --no-install markdownlint-cli2 --fix

  - id: "fix-prettier"
    name: "Fix all fixable prettier issues"
    command: |
      npx --no-install prettier --write .

  - id: "coverage"
    name: "Run coverage check"
    command: |
      make coverage

  - id: "build"
    name: "Build the project"
    command: |
      make build

  - id: "prep-go"
    name: "Prepare Go environment"
    command: |
      make deps
      make tidy

waves:
  - id: "post-create"
    name: "Dev Container Post Create"
    parallel: true
    checks:
      - "gh-auth"
      - "install-takt"
      - "install-takt-shortcuts"
      - "safe-repo"
      - "repo-gitconfig"
      - "repo-npm"
      - "prep-go"

  - id: "prep-runner"
    name: "Run to prepare GitHub runner"
    parallel: true
    checks:
      - "gh-auth"
      - "repo-npm"
      - "repo-gitconfig"
      - "prep-go"

  - id: "trunk-worthy"
    name: "Worthy for trunk - build"
    parallel: true
    checks:
      - "cspell"
      - "markdownlint"
      - "prettier"
      - "coverage"
      - "build"

  - id: "fix-all"
    name: "Fix anything that can be fixed automatically"
    parallel: true
    checks:
      - "fix-markdown"
      - "fix-prettier"
