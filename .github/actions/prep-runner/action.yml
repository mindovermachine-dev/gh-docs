name: Prep-runner
description: Sets the GitHub workflow to do what we need

inputs:
  verify:
    description: Script to run to verify the environment is set up correctly. If not provided, no verification will be done.
    required: false

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    # Install npm packages required by .githooks/pre-commit
    - name: Install insitu
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        gh extension install devx-cafe/gh-insitu
        gh insitu run prep-runner

    
    - name: Verify environment
      if: ${{ inputs.verify }}
      shell: bash
      run: ${{ inputs.verify }}
    